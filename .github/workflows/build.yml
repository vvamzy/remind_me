name: build-windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure dist
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
        shell: pwsh

      - name: Install build tools
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          choco install innosetup -y --no-progress
          choco install imagemagick -y --no-progress
        shell: pwsh

      - name: Generate icon from SVG
        run: |
          magick convert assets/icon.svg -background none -resize 512x512 assets/icon.png
          magick convert assets/icon.png -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
        shell: pwsh

      - name: Compile EXE
        run: |
          Import-Module ps2exe
          Invoke-ps2exe -inputFile .\src\app.ps1 -outputFile .\dist\TodoTimer.exe -iconFile .\assets\icon.ico -noConsole
        shell: pwsh

      - name: Build installer
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          & $iscc assets\installer.iss
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/TodoTimer.exe
            dist/TodoTimer-Setup.exe
